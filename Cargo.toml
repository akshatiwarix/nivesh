[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# One version of every dependency, shared by all members.
[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tauri = { version = "2.12.6", features = [] }
tauri-build = { version = "2.7.5", features = [] }
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "smallvec", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Warned here and denied in CI (`-D warnings`); tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
