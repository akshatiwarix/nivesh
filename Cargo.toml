[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# One version of every dependency, shared by all members.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
feed-rs = "3.0.0"
governor = "0.10.4"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", features = ["brotli", "cookies", "form", "gzip", "json"] }
secrecy = "0.10.3"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
tauri = { version = "2.12.6", features = [] }
tauri-build = { version = "2.7.5", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
wiremock = "0.6.5"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
url = "2.5.7"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "smallvec", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Warned here and denied in CI (`-D warnings`); tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
