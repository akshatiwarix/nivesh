[package]
name = "nivesh-app"
description = "Nivesh desktop app: Tauri commands, events and wiring. No business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "nivesh"

[lib]
name = "nivesh_app"
path = "src/lib.rs"

[[bin]]
name = "nivesh"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
nivesh-broker = { path = "../crates/nivesh-broker" }
nivesh-broker-kite = { path = "../crates/nivesh-broker-kite" }
nivesh-core = { path = "../crates/nivesh-core" }
nivesh-secrets = { path = "../crates/nivesh-secrets" }
nivesh-data = { path = "../crates/nivesh-data" }
url = { workspace = true }
nivesh-indicators = { path = "../crates/nivesh-indicators" }
nivesh-store = { path = "../crates/nivesh-store" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

[dev-dependencies]
chrono.workspace = true
wiremock.workspace = true

[lints]
workspace = true
