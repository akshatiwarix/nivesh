[package]
name = "nivesh-broker-kite"
description = "Zerodha Kite Connect adapter for Nivesh: login, REST account data and the WebSocket ticker. Read-only in Part 4; order placement arrives in Part 6 behind the live-trading feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono = { workspace = true, features = ["clock"] }
csv.workspace = true
futures-util.workspace = true
governor.workspace = true
nivesh-broker = { path = "../nivesh-broker" }
nivesh-core = { path = "../nivesh-core" }
nivesh-data = { path = "../nivesh-data" }
nivesh-secrets = { path = "../nivesh-secrets" }
nivesh-store = { path = "../nivesh-store" }
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

nivesh-risk = { path = "../nivesh-risk", optional = true }

[features]
# Order placement, modification and cancellation. Off by default: a build
# without it has no code that can send an order to Zerodha.
live-trading = ["dep:nivesh-risk"]

[dev-dependencies]
nivesh-risk = { path = "../nivesh-risk" }
proptest.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
